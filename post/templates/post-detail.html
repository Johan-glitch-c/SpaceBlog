{% extends 'base.html' %}
{% load static %}


{% block content %}

<section class="post-header">

    <div class="container">

        <span class="category">
            {{ post.category }}
        </span>

        <h1>
            {{ post.title}}
        </h1>

        <div class="post-meta">

            <span>{{ post.author}}</span>
            <span>•</span>
            <span>{{ post.upload_date}}</span>
            <span>•</span>
            <span>{{ post.time_to_read}}</span>

        </div>

    </div>

</section>

<section class="post-content">

    <div class="container content-container">

       {{post.content|linebreaks}}

    </div>

</section>

<section class="post-footer">

    <div class="container">

        <a href="{% url 'posts' %}" class="back-btn">
            ← Back to Articles
        </a>

    </div>

</section>

{% endblock %}
